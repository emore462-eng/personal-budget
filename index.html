<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Presupuesto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 transition">

  <!-- Botón toggle modo oscuro -->
  <div class="max-w-4xl mx-auto px-4 pt-4 flex justify-end">
    <button
      id="toggle-dark"
      class="text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition"
    >
      🌙 Modo oscuro
    </button>
  </div>

  <main class="max-w-4xl mx-auto px-3 sm:px-4 lg:px-6 py-6 sm:py-8">

    <header class="mb-4 sm:mb-6">
      <!-- móvil: text-2xl · tablet: text-3xl · escritorio: text-4xl -->
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 dark:text-white">
        💰 Gestor de Presupuesto
      </h1>
      <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400">Tu dinero, bajo control.</p>
    </header>

    <!-- Alerta de límites -->
    <div id="alerta-limites" class="mb-4 sm:mb-6"></div>

    <!-- móvil: 1 columna · tablet en adelante: 2 columnas -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">

      <!-- Tarjeta resumen -->
      <div class="p-4 sm:p-6 bg-white dark:bg-gray-800 rounded-xl shadow hover:scale-105 transition">
        <h2 class="text-xs sm:text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
          Saldo total
        </h2>
        <!-- móvil: text-3xl · escritorio: text-4xl -->
        <p id="saldo" class="mt-1 text-3xl sm:text-4xl font-bold text-gray-800 dark:text-white">$0.00</p>

        <!-- móvil: apilado · sm en adelante: fila -->
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-4">
          <div class="flex-1 p-3 bg-green-50 dark:bg-green-900 rounded-lg">
            <p class="text-xs text-green-700 dark:text-green-400">Ingresos</p>
            <p id="total-ingresos" class="text-base sm:text-lg font-semibold text-green-700 dark:text-green-400">$0.00</p>
          </div>
          <div class="flex-1 p-3 bg-red-50 dark:bg-red-900 rounded-lg">
            <p class="text-xs text-red-700 dark:text-red-400">Gastos</p>
            <p id="total-gastos" class="text-base sm:text-lg font-semibold text-red-700 dark:text-red-400">$0.00</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta formulario -->
      <div class="p-4 sm:p-6 bg-white dark:bg-gray-800 rounded-xl shadow hover:scale-105 transition">
        <h2 class="mb-3 sm:mb-4 text-base sm:text-lg font-semibold text-gray-800 dark:text-white">
          Agregar movimiento
        </h2>
        <form id="form-mov" class="space-y-3">
          <input
            id="nombre"
            type="text"
            placeholder="Nombre"
            class="w-full p-2 sm:p-3 text-sm sm:text-base border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <select
            id="tipo"
            class="w-full p-2 sm:p-3 text-sm sm:text-base border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
          <input
            id="monto"
            type="number"
            placeholder="Monto"
            class="w-full p-2 sm:p-3 text-sm sm:text-base border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <button
            type="submit"
            class="w-full p-2 sm:p-3 text-sm sm:text-base bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 transition"
          >
            Agregar
          </button>
        </form>
      </div>

    </section>

    <!-- Lista de movimientos -->
    <section class="mt-4 sm:mt-6 p-4 sm:p-6 bg-white dark:bg-gray-800 rounded-xl shadow">
      <h2 class="mb-3 sm:mb-4 text-base sm:text-lg font-semibold text-gray-800 dark:text-white">
        Movimientos
      </h2>
      <ul id="lista" class="space-y-2"></ul>
    </section>

  </main>

  <script src="oop-objects.js"></script>
  <script src="functional-utils.js"></script>
  <script src="app.js"></script>

  <script>
    const btn  = document.getElementById('toggle-dark');
    const html = document.documentElement;

    btn.addEventListener('click', () => {
      html.classList.toggle('dark');
      btn.textContent = html.classList.contains('dark') ? '☀️ Modo claro' : '🌙 Modo oscuro';
    });
  </script>

</body>
  
</html>
